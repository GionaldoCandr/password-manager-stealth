[package]
name = "launcher"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = "0.5"
aes-gcm = "0.10"
rand = "0.8"
zeroize = "1.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
winres = { workspace = true }


[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_Foundation"
] }